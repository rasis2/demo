<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stamp Tandatangan PDF</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #0ea5e9;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header .badge {
    font-size: 12px;
    color: var(--muted);
  }
  .main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .stage-wrap {
    flex: 1;
    overflow: auto;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #0b1120;
  }
  .stage {
    position: relative;
    background: #fff;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    touch-action: none;
  }
  .stage img.pageimg {
    display: block;
    width: 100%;
    height: 100%;
  }
  #sigBox {
    position: absolute;
    cursor: move;
    touch-action: none;
    user-select: none;
    z-index: 5;
  }
  #sigBox img {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }
  #sigBox.dragging { outline: 2px dashed var(--accent); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
  }
  input[type="file"] {
    display: none;
  }
  .file-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .file-btn:hover { border-color: var(--accent); }
  .file-btn .ico { font-size: 20px; }
  .file-btn .meta { font-size: 12px; color: var(--muted); }
  .file-btn .meta b { color: var(--text); display: block; }
  button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #2f3d55; }
  button.primary {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #0b1120;
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row.grow { justify-content: space-between; }
  input[type="range"] { width: 100%; }
  input[type="color"] {
    width: 42px;
    height: 30px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
  }
  .nav { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .nav .pg { font-size: 13px; color: var(--muted); min-width: 90px; text-align: center; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .chk input { width: 16px; height: 16px; accent-color: var(--accent2); }
  .target-note {
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    padding: 7px 8px;
    border-radius: 6px;
    background: var(--panel2);
    color: var(--accent2);
  }
  #status {
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
  }
  #status.err { color: #f87171; }
  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 2px;
  }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(2,6,23,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 640px;
    max-width: 94vw;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal h2 { margin: 0 0 14px; font-size: 16px; }
  .pad-wrap {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    touch-action: none;
    cursor: crosshair;
  }
  .pad-wrap canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }
</style>
</head>
<body>
<header>
  <h1>Stamp Tandatangan PDF</h1>
  <span class="badge">Letak tandatangan pada setiap muka surat</span>
  <div style="margin-left:auto">
    <button id="resetBtn" style="font-size:13px">↺ Reset / Clear</button>
  </div>
</header>

<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="field">
      <label>1. Fail PDF</label>
      <label class="file-btn">
        <span class="ico">📄</span>
        <span class="meta"><b id="pdfName">Pilih fail PDF…</b>*.pdf</span>
        <input type="file" id="pdfFile" accept=".pdf,application/pdf">
      </label>
    </div>

    <button class="primary" id="uploadBtn" disabled>Muat Naik PDF</button>
    <div id="status">Sila pilih fail PDF.</div>

    <div class="section-title">Tandatangan</div>
    <button id="drawBtn">✍️ Lukis Tandatangan</button>
    <div class="row grow">
      <label style="font-size:13px">Saiz</label>
      <span id="sizeVal" style="font-size:13px;color:var(--muted)">60 pt</span>
    </div>
    <input type="range" id="sizeSlider" min="20" max="300" value="60">

    <div class="row grow">
      <label style="font-size:13px">Warna dakwat</label>
      <input type="color" id="colorPicker" value="#000000">
    </div>

    <div class="row grow">
      <label style="font-size:13px">Kelegapan</label>
      <span id="opacityVal" style="font-size:13px;color:var(--muted)">100%</span>
    </div>
    <input type="range" id="opacitySlider" min="10" max="100" value="100">

    <button id="rotateBtn">↻ Putar 90°</button>

    <label class="chk">
      <input type="checkbox" id="removeBg" checked>
      Buang latar belakang automatik
    </label>

    <div class="section-title">Muka Surat</div>
    <div class="nav">
      <button id="prevBtn">◀</button>
      <span class="pg" id="pageInfo">-</span>
      <button id="nextBtn">▶</button>
    </div>
    <div id="targetNote" class="target-note"></div>
    <button id="setTargetBtn" style="display:none">🎯 Sasarkan muka surat ini</button>
    <label class="chk">
      <input type="checkbox" id="applyAll" checked>
      Terapkan pada semua muka surat
    </label>

    <button class="primary" id="downloadBtn" disabled>⬇ Download PDF</button>
    <div class="hint">Seret tandatangan untuk ubah posisi. Saiz dikira dalam titik PDF (72pt = 1 inci).</div>
  </div>

  <!-- Stage -->
  <div class="stage-wrap">
    <div class="stage" id="stage" style="display:none">
      <img class="pageimg" id="pageImg" alt="Preview muka surat">
      <div id="sigBox" style="display:none"><img id="sigImg" alt="Tandatangan"></div>
    </div>
    <div class="stage-empty" id="emptyState" style="text-align:center;color:var(--muted);padding:60px">
      <div style="font-size:44px;margin-bottom:12px">🖊️</div>
      <div>Muat naik PDF, kemudian lukis tandatangan anda.</div>
    </div>
  </div>
</div>

<!-- Drawing modal -->
<div class="modal-backdrop" id="drawModal" style="display:none">
  <div class="modal">
    <h2>Lukis Tandatangan</h2>
    <div class="pad-wrap">
      <canvas id="drawCanvas" width="900" height="360"></canvas>
    </div>
    <div class="row grow" style="margin-top:10px">
      <label style="font-size:13px">Ketebalan</label>
      <span id="thickVal" style="font-size:13px;color:var(--muted)">3</span>
    </div>
    <input type="range" id="thickSlider" min="1" max="10" value="3" step="0.5">
    <div class="row" style="margin-top:14px">
      <button id="drawClear" style="flex:1">🗑 Kosongkan</button>
      <button id="drawCancel" style="flex:1">Tutup</button>
      <button id="drawUse" class="primary" style="flex:1.4">✓ Guna Tandatangan Ini</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = {
    sid: null,
    pageCount: 0,
    pageW: 0,
    pageH: 0,
    curPage: 1,
    targetPage: 1,
    hasSig: false,
    sigAspect: 1,
    sigW: 60,
    rotate: 0,
    color: "#000000",
    opacity: 1,
    removeBg: true,
    applyAll: true,
  };

  const pdfFile = $("pdfFile");
  const stage = $("stage"), pageImg = $("pageImg"), sigBox = $("sigBox"), sigImg = $("sigImg");
  const sizeSlider = $("sizeSlider"), colorPicker = $("colorPicker"), opacitySlider = $("opacitySlider");

  function setStatus(msg, err) {
    const s = $("status");
    s.textContent = msg;
    s.classList.toggle("err", !!err);
  }

  pdfFile.addEventListener("change", () => {
    $("pdfName").textContent = pdfFile.files[0] ? pdfFile.files[0].name : "Pilih fail PDF…";
    $("uploadBtn").disabled = !pdfFile.files[0];
    setStatus(pdfFile.files[0] ? "Sedia. Tekan 'Muat Naik PDF'." : "Sila pilih fail PDF.");
  });

  $("uploadBtn").addEventListener("click", async () => {
    if (!pdfFile.files[0]) return;
    setStatus("Memuat naik…");
    $("uploadBtn").disabled = true;
    const fd = new FormData();
    fd.append("pdf", pdfFile.files[0]);
    try {
      const res = await fetch("/api/upload", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Gagal memuat naik.");
      state.sid = data.sid;
      state.pageCount = data.page_count;
      state.pageW = data.width;
      state.pageH = data.height;
      state.curPage = 1;
      $("emptyState").style.display = "none";
      stage.style.display = "block";
      stage.style.width = state.pageW + "px";
      stage.style.height = state.pageH + "px";
      await loadPage(state.curPage);
      updateTargetUI();
      setStatus("Sekarang lukis tandatangan anda.");
      $("drawModal").style.display = "flex";
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      $("uploadBtn").disabled = false;
    }
  });

  function sigOpts() {
    return {
      rotate: state.rotate,
      color: state.color,
      opacity: state.opacity,
      remove_bg: state.removeBg,
    };
  }

  async function loadPage(n) {
    pageImg.src = `/api/session/${state.sid}/page/${n}.png`;
    $("pageInfo").textContent = `${n} / ${state.pageCount}`;
    $("prevBtn").disabled = n <= 1;
    $("nextBtn").disabled = n >= state.pageCount;
    updateTargetUI();
    syncBoxVisibility();
  }

  function updateTargetUI() {
    const note = $("targetNote");
    if (state.applyAll) {
      note.textContent = `Akan ditandatangani: SEMUA ${state.pageCount} muka surat`;
      note.style.color = "var(--accent2)";
      $("setTargetBtn").style.display = "none";
    } else {
      note.textContent = `Akan ditandatangani: muka surat ${state.targetPage} SAHAJA`;
      note.style.color = "#fbbf24";
      $("setTargetBtn").style.display = (state.curPage !== state.targetPage) ? "block" : "none";
    }
  }

  function syncBoxVisibility() {
    const target = state.applyAll ? state.curPage : state.targetPage;
    const show = state.hasSig && (state.applyAll || state.curPage === target);
    sigBox.style.display = show ? "block" : "none";
  }

  function loadSig() {
    return new Promise((resolve) => {
      const url = `/api/session/${state.sid}/sig.png?opts=${encodeURIComponent(JSON.stringify(sigOpts()))}`;
      const probe = new Image();
      probe.onload = () => {
        state.sigAspect = probe.naturalWidth / probe.naturalHeight;
        sigImg.src = url;
        sigBox.style.display = state.hasSig ? "block" : "none";
        syncBoxVisibility();
        resolve();
      };
      probe.src = url;
    });
  }

  function placeDefault() {
    const w = Math.min(140, state.pageW * 0.25);
    state.sigW = w;
    sizeSlider.value = Math.round(w);
    $("sizeVal").textContent = Math.round(w) + " pt";
    updateBox(true);
  }

  function updateBox(keepCenter) {
    const h = state.sigW / state.sigAspect;
    const style = sigBox.style;
    const prevCenterX = style.left ? parseFloat(style.left) + sigBox.offsetWidth / 2 : null;
    const prevCenterY = style.top ? parseFloat(style.top) + sigBox.offsetHeight / 2 : null;
    style.width = state.sigW + "px";
    style.height = h + "px";
    if (prevCenterX != null && keepCenter) {
      style.left = clamp(prevCenterX - state.sigW / 2, 0, state.pageW - state.sigW) + "px";
      style.top = clamp(prevCenterY - h / 2, 0, state.pageH - h) + "px";
    } else if (!style.left) {
      style.left = (state.pageW - state.sigW) / 2 + "px";
      style.top = (state.pageH * 0.82 - h) + "px";
    }
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  sizeSlider.addEventListener("input", () => {
    state.sigW = parseFloat(sizeSlider.value);
    $("sizeVal").textContent = Math.round(state.sigW) + " pt";
    updateBox(true);
  });

  colorPicker.addEventListener("input", () => {
    state.color = colorPicker.value;
    loadSig().then(() => updateBox(true));
  });

  opacitySlider.addEventListener("input", () => {
    state.opacity = parseFloat(opacitySlider.value) / 100;
    $("opacityVal").textContent = opacitySlider.value + "%";
    loadSig().then(() => updateBox(true));
  });

  $("removeBg").addEventListener("change", () => {
    state.removeBg = $("removeBg").checked;
    loadSig().then(() => updateBox(true));
  });

  $("rotateBtn").addEventListener("click", () => {
    state.rotate = (state.rotate + 90) % 360;
    loadSig().then(() => updateBox(true));
  });

  $("prevBtn").addEventListener("click", () => { if (state.curPage > 1) loadPage(--state.curPage); });
  $("nextBtn").addEventListener("click", () => { if (state.curPage < state.pageCount) loadPage(++state.curPage); });
  $("applyAll").addEventListener("change", () => {
    state.applyAll = $("applyAll").checked;
    if (!state.applyAll) state.targetPage = state.curPage;
    updateTargetUI();
    syncBoxVisibility();
  });
  $("setTargetBtn").addEventListener("click", () => {
    state.targetPage = state.curPage;
    updateTargetUI();
    syncBoxVisibility();
  });

  // ---------------- Reset / Clear ----------------
  function resetAll() {
    pdfFile.value = "";
    $("pdfName").textContent = "Pilih fail PDF…";
    if (state.sid) fetch(`/api/session/${state.sid}`, { method: "DELETE" }).catch(() => {});
    state.sid = null;
    state.pageCount = 0;
    state.pageW = 0;
    state.pageH = 0;
    state.curPage = 1;
    state.targetPage = 1;
    state.hasSig = false;
    state.sigAspect = 1;
    sigBox.style.display = "none";
    stage.style.display = "none";
    $("emptyState").style.display = "";
    $("downloadBtn").disabled = true;
    $("uploadBtn").disabled = true;
    $("pageInfo").textContent = "-";
    $("targetNote").textContent = "";
    $("setTargetBtn").style.display = "none";
    setStatus("Sila pilih fail PDF.");
  }
  $("resetBtn").addEventListener("click", resetAll);

  // ---------------- Lukis tandatangan ----------------
  const drawCanvas = $("drawCanvas");
  const dctx = drawCanvas.getContext("2d");
  let drawing = false, lastX = 0, lastY = 0;

  function resetCanvas() {
    dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  }
  resetCanvas();

  function canvasPos(e) {
    const r = drawCanvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (drawCanvas.width / r.width),
      y: (e.clientY - r.top) * (drawCanvas.height / r.height),
    };
  }

  $("thickSlider").addEventListener("input", () => {
    $("thickVal").textContent = parseFloat($("thickSlider").value);
  });

  drawCanvas.addEventListener("pointerdown", (e) => {
    drawing = true;
    drawCanvas.setPointerCapture(e.pointerId);
    const p = canvasPos(e);
    lastX = p.x; lastY = p.y;
    dctx.lineWidth = parseFloat($("thickSlider").value);
    dctx.lineCap = "round";
    dctx.lineJoin = "round";
    dctx.strokeStyle = "#000";
    dctx.beginPath();
    dctx.moveTo(p.x, p.y);
    dctx.lineTo(p.x + 0.01, p.y + 0.01);
    dctx.stroke();
    e.preventDefault();
  });
  drawCanvas.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    const p = canvasPos(e);
    dctx.lineTo(p.x, p.y);
    dctx.stroke();
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach((ev) => {
    drawCanvas.addEventListener(ev, () => { drawing = false; });
  });

  $("drawBtn").addEventListener("click", () => {
    if (!state.sid) { setStatus("Muat naik PDF dahulu sebelum lukis tandatangan.", true); return; }
    resetCanvas();
    $("drawModal").style.display = "flex";
  });
  $("drawCancel").addEventListener("click", () => { $("drawModal").style.display = "none"; });
  $("drawClear").addEventListener("click", resetCanvas);

  $("drawUse").addEventListener("click", async () => {
    const blob = await new Promise((res) => drawCanvas.toBlob(res, "image/png"));
    const fd = new FormData();
    fd.append("sid", state.sid);
    fd.append("image", blob, "drawn.png");
    try {
      const res = await fetch("/api/signature", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Gagal simpan tandatangan.");
      $("drawModal").style.display = "none";
      state.hasSig = true;
      state.targetPage = state.curPage;
      await loadSig();
      placeDefault();
      updateTargetUI();
      $("downloadBtn").disabled = false;
      setStatus(`Tandatangan disimpan. ${state.pageCount} muka surat sedia.`);
    } catch (e) {
      setStatus(e.message, true);
    }
  });

  // Drag
  let dragging = false, dx = 0, dy = 0;
  sigBox.addEventListener("pointerdown", (e) => {
    dragging = true;
    dx = e.clientX - sigBox.offsetLeft;
    dy = e.clientY - sigBox.offsetTop;
    sigBox.setPointerCapture(e.pointerId);
    sigBox.classList.add("dragging");
    e.preventDefault();
  });
  sigBox.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const left = clamp(e.clientX - dx, 0, state.pageW - sigBox.offsetWidth);
    const top = clamp(e.clientY - dy, 0, state.pageH - sigBox.offsetHeight);
    sigBox.style.left = left + "px";
    sigBox.style.top = top + "px";
  });
  sigBox.addEventListener("pointerup", (e) => {
    dragging = false;
    sigBox.classList.remove("dragging");
  });

  function rect() {
    const x0 = parseFloat(sigBox.style.left);
    const y0 = parseFloat(sigBox.style.top);
    return {
      x0,
      y0,
      x1: x0 + state.sigW,
      y1: y0 + state.sigW / state.sigAspect,
    };
  }

  $("downloadBtn").addEventListener("click", async () => {
    const btn = $("downloadBtn");
    btn.disabled = true;
    setStatus("Menjana PDF…");
    try {
      const res = await fetch("/api/sign", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sid: state.sid,
          rect: rect(),
          pages: state.applyAll ? "all" : state.targetPage,
          options: sigOpts(),
        }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || "Gagal menjana.");
      }
      const blob = await res.blob();
      const a = document.createElement("a");
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = "signed.pdf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      setStatus("PDF siap dimuat turun.");
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>

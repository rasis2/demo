<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Kesuma JMB</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .stat-row { display:flex; gap:0; padding:0; overflow:hidden; margin-bottom:12px; }
    .stat-row > div { flex:1; padding:14px; text-align:center; border-right:1px solid var(--border); }
    .stat-row > div:last-child { border-right:none; }
    .stat-icon { font-size:18px; }
    .stat-val { font-size:22px; }
    .stat-lbl { font-size:10px; color:var(--text-muted); margin-top:2px; }
    .quick-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; }
    .quick { background:var(--surface2); border:1px solid var(--border); border-radius:10px; text-decoration:none; color:inherit; padding:14px 10px; text-align:center; transition:all 0.2s; }
    .quick:hover { border-color:rgba(var(--accent-rgb),0.35); background:var(--surface); transform:translateY(-1px); }
    .quick .qi { font-size:20px; margin-bottom:6px; }
    .quick .qn { font-size:11px; font-weight:700; }
    .ann-item { padding:12px 0; border-bottom:1px solid var(--border); }
    .ann-item:last-child { border-bottom:none; }
    .ann-title { font-family:var(--heading-font); font-weight:700; font-size:14px; margin-bottom:2px; }
    .ann-meta { font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
    .ann-pin { color:var(--accent); }
  </style>
</head>
<body>
  <nav class="nav" id="mainNav"></nav>

  <div id="pinGate" style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 57px)">
    <div style="width:100%;max-width:360px;padding:20px">
      <div class="section animate-in">
        <div class="page-icon red" style="margin-bottom:18px">📊</div>
        <h2 style="font-family:var(--heading-font);font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:-0.5px" id="txt-pin-title"></h2>
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px" id="txt-pin-subtitle"></p>
        <div class="field">
          <input type="password" id="adminPin" maxlength="10" onkeydown="if(event.key==='Enter')unlock()">
          <div class="error-text" id="pinError"></div>
        </div>
        <button class="btn btn-gold" onclick="unlock()" style="margin-top:4px" id="txt-enter-btn"></button>
      </div>
    </div>
  </div>

  <div id="dashboard" style="display:none">
    <main class="main">
      <div class="page-header animate-in">
        <div class="page-icon red">📊</div>
        <h1 class="page-title" id="txt-title"></h1>
        <p class="page-subtitle" id="txt-subtitle"></p>
      </div>

      <div id="statsWrap"></div>

      <div class="section animate-in" style="margin-top:14px">
        <div class="section-title" id="txt-quick"></div>
        <div class="quick-grid" id="quickGrid"></div>
      </div>

      <div class="section animate-in">
        <div class="section-title" id="txt-recent"></div>
        <div id="annList"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderNav('sys_dashboard')
    const $ = id => document.getElementById(id)
    $('txt-pin-title').textContent = t('dash_title')
    $('txt-pin-subtitle').textContent = t('admin_pin_subtitle')
    $('adminPin').placeholder = '••••'
    $('txt-enter-btn').textContent = t('enter')
    $('txt-title').textContent = t('dash_title')
    $('txt-subtitle').textContent = t('dash_subtitle')
    $('txt-quick').textContent = t('dash_quick')
    $('txt-recent').textContent = t('dash_recent')

    function unlock() {
      if ($('adminPin').value !== kj_load().settings.pin_admin) {
        $('pinError').textContent = t('admin_pin_error'); return
      }
      $('pinGate').style.display = 'none'
      $('dashboard').style.display = 'block'
      load()
    }

    async function load() {
      const s = await apiStats()
      $('statsWrap').innerHTML = [
        '<div class="section animate-in stat-row">' +
          statBox('🏢', t('dash_units'), s.units) +
          statBox('📦', t('dash_parcel_pending'), s.parcelsPending, 'var(--accent)') +
          statBox('✅', t('dash_parcel_done'), s.parcelsDone, 'var(--green)') +
        '</div>',
        '<div class="section animate-in stat-row">' +
          statBox('🪪', t('dash_vis_pending'), s.visitorsPending, 'var(--accent)') +
          statBox('🚶', t('dash_vis_today'), s.visitorsToday) +
          statBox('🔧', t('dash_maint_open'), s.maintOpen, 'var(--red)') +
          statBox('🛠️', t('dash_maint_done'), s.maintResolved, 'var(--green)') +
        '</div>',
        '<div class="section animate-in stat-row">' +
          statBox('💰', t('dash_pay_collected'), fmtMoney(s.paymentsTotal), 'var(--green)') +
          statBox('🧾', t('dash_pay_count'), s.paymentsCount) +
          statBox('📅', t('dash_book_pending'), s.bookingsPending, 'var(--accent)') +
          statBox('🚗', t('dash_vehicles'), s.vehicles) +
        '</div>',
      ].join('')

      const quick = [
        ['📦', t('sys_parcel'), 'admin.html'], ['🪪', t('sys_visitor'), 'admin.html'],
        ['🔧', t('sys_maintenance'), 'maintenance.html'], ['💰', t('sys_payments'), 'payments.html'],
        ['📢', t('sys_announcements'), 'announcements.html'], ['📅', t('sys_bookings'), 'bookings.html'],
        ['🚗', t('sys_vehicles'), 'vehicles.html'], ['📄', t('sys_documents'), 'documents.html'],
        ['👥', t('sys_residents'), 'residents.html'], ['🏠', t('card_owner'), 'owner.html'],
      ]
      $('quickGrid').innerHTML = quick.map(q =>
        '<a class="quick" href="' + q[2] + '"><div class="qi">' + q[0] + '</div><div class="qn">' + q[1] + '</div></a>'
      ).join('')

      const anns = await apiGetAnnouncements()
      const el = $('annList')
      if (!anns.length) { el.innerHTML = emptyState('📢', t('dash_noann')); return }
      el.innerHTML = anns.slice(0, 4).map(a =>
        '<div class="ann-item"><div class="ann-title' + (a.pinned ? ' ann-pin' : '') + '">' + (a.pinned ? '📌 ' : '') + esc(a.title) + '</div>' +
        '<div class="ann-meta">' + fmtDate(a.created_at) + ' · ' + esc(a.author) + '</div>' +
        '<div style="font-size:12px;color:var(--text-muted);margin-top:4px">' + esc(a.body) + '</div></div>'
      ).join('')
    }
  </script>
</body>
</html>

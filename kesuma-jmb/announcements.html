<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notis & Pengumuman — Kesuma JMB</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .ann-card { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; transition:border-color 0.2s; }
    .ann-card.pinned { border-color:rgba(var(--accent-rgb),0.35); background:var(--accent-dim); }
    .ann-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:4px; }
    .ann-title { font-family:var(--heading-font); font-weight:800; font-size:15px; }
    .ann-meta { font-size:11px; color:var(--text-muted); margin-bottom:8px; font-family:'JetBrains Mono',monospace; }
    .ann-body { font-size:13px; color:var(--text-soft); line-height:1.6; }
    .ann-cat { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--accent); }
    .btn-sm-danger { background:var(--red-dim); color:var(--red); border:1px solid rgba(224,92,92,0.3); border-radius:7px; padding:6px 12px; font-size:11px; font-weight:600; cursor:pointer; }
    .pin-toggle { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); cursor:pointer; }
  </style>
</head>
<body>
  <nav class="nav" id="mainNav"></nav>
  <main class="main">
    <div class="page-header animate-in">
      <div class="page-icon gold">📢</div>
      <h1 class="page-title" id="txt-title"></h1>
      <p class="page-subtitle" id="txt-subtitle"></p>
    </div>

    <div class="mode-row" style="display:flex;gap:6px;margin-bottom:14px;background:var(--surface2);border-radius:10px;padding:4px">
      <div class="mode" style="flex:1;text-align:center;padding:8px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-muted)" id="modeView" onclick="switchMode('view')">👁️ <span id="txt-mode-view"></span></div>
      <div class="mode" style="flex:1;text-align:center;padding:8px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-muted)" id="modeAdmin" onclick="switchMode('admin')">⚙️ <span id="txt-mode-admin"></span></div>
    </div>

    <div id="adminPinBox" style="display:none">
      <div class="section animate-in">
        <div class="section-title" id="txt-admin-pin-title"></div>
        <div class="field"><input type="password" id="pin" maxlength="10" onkeydown="if(event.key==='Enter')adminLogin()"></div>
        <button class="btn btn-gold" onclick="adminLogin()" id="txt-admin-login-btn"></button>
      </div>
    </div>

    <div id="postForm" style="display:none">
      <div class="section animate-in">
        <div class="section-title" id="txt-post-section"></div>
        <div class="field"><label id="txt-ann-title"></label><input id="annTitle" maxlength="100"></div>
        <div class="field">
          <label id="txt-ann-cat"></label>
          <div class="select-wrap"><select id="annCat"></select></div>
        </div>
        <div class="field"><label id="txt-ann-body"></label><textarea id="annBody" rows="3"></textarea></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px">
          <label class="pin-toggle"><input type="checkbox" id="annPinned"> <span id="txt-ann-pinned"></span></label>
          <button class="btn btn-gold" style="width:auto" onclick="publish()" id="txt-ann-publish"></button>
        </div>
      </div>
    </div>

    <div class="section animate-in">
      <div class="section-title" id="txt-list-section"></div>
      <div id="annList"></div>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderNav('ann_title')
    const $ = id => document.getElementById(id)
    let admin = false

    $('txt-title').textContent = t('ann_title'); $('txt-subtitle').textContent = t('ann_subtitle')
    $('txt-mode-view').textContent = t('view'); $('txt-mode-admin').textContent = t('role_admin')
    $('txt-admin-pin-title').textContent = t('admin_pin_title'); $('txt-admin-login-btn').textContent = t('enter')
    $('txt-post-section').textContent = t('ann_post_section')
    $('txt-ann-title').textContent = t('ann_title_lbl'); $('txt-ann-cat').textContent = t('ann_category')
    $('txt-ann-body').textContent = t('ann_body_lbl'); $('txt-ann-pinned').textContent = t('ann_pinned')
    $('txt-ann-publish').textContent = '✓ ' + t('ann_publish'); $('txt-list-section').textContent = t('ann_list_section')

    const catKeys = { 'Penting':'ann_cat_penting', 'AGM':'ann_cat_agm', 'Penyelenggaraan':'ann_cat_maint', 'Kemudahan':'ann_cat_fac', 'Acara':'ann_cat_acara', 'Keselamatan':'ann_cat_keselamatan' }
    Object.keys(catKeys).forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = t(catKeys[c]); $('annCat').appendChild(o) })

    function switchMode(m) {
      $('modeView').style.background = m === 'view' ? 'var(--surface)' : 'transparent'
      $('modeView').style.color = m === 'view' ? 'var(--text)' : 'var(--text-muted)'
      $('modeAdmin').style.background = m === 'admin' ? 'var(--surface)' : 'transparent'
      $('modeAdmin').style.color = m === 'admin' ? 'var(--text)' : 'var(--text-muted)'
      $('adminPinBox').style.display = m === 'admin' && !admin ? 'block' : 'none'
      $('postForm').style.display = admin ? 'block' : 'none'
    }

    function adminLogin() {
      if ($('pin').value !== kj_load().settings.pin_admin) { showToast(t('admin_pin_error'), 'error-toast'); return }
      admin = true
      $('adminPinBox').style.display = 'none'
      $('postForm').style.display = 'block'
    }

    async function publish() {
      const title = $('annTitle').value.trim()
      if (!title) { showToast(t('ann_title_lbl'), 'error-toast'); return }
      await apiAddAnnouncement({ title, category: $('annCat').value, body: $('annBody').value.trim(), pinned: $('annPinned').checked, author: t('ann_author') })
      showToast(t('ann_success'), 'success')
      $('annTitle').value = ''; $('annBody').value = ''; $('annPinned').checked = false
      loadList()
    }

    async function remove(id) {
      await apiDeleteAnnouncement(id)
      showToast(t('ann_deleted'), 'success')
      loadList()
    }

    async function loadList() {
      const list = await apiGetAnnouncements()
      const el = $('annList')
      if (!list.length) { el.innerHTML = emptyState('📢', t('ann_empty')); return }
      el.innerHTML = list.map(a =>
        '<div class="ann-card' + (a.pinned ? ' pinned' : '') + '">' +
          '<div class="ann-top">' +
            '<div><span class="ann-cat">' + (a.pinned ? '📌 ' : '') + t(catKeys[a.category] || 'ann_cat_penting') + '</span>' +
            '<div class="ann-title" style="margin-top:4px">' + esc(a.title) + '</div></div>' +
            (admin ? '<button class="btn-sm-danger" onclick="remove(\'' + a.id + '\')">' + t('ann_delete') + '</button>' : '') +
          '</div>' +
          '<div class="ann-meta">' + esc(a.author) + ' · ' + fmtDate(a.created_at) + '</div>' +
          (a.body ? '<div class="ann-body">' + esc(a.body) + '</div>' : '') +
        '</div>'
      ).join('')
    }
    loadList()
  </script>
</body>
</html>

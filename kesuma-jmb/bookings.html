<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tempahan Kemudahan — Kesuma JMB</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .mode-row { display:flex; gap:6px; margin-bottom:14px; background:var(--surface2); border-radius:10px; padding:4px; }
    .mode { flex:1; text-align:center; padding:8px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; transition:all 0.2s; color:var(--text-muted); }
    .mode.active { background:var(--surface); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.15); }
    .fac-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:4px; }
    .fac { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; cursor:pointer; transition:all 0.2s; }
    .fac:hover { border-color:rgba(var(--accent-rgb),0.4); }
    .fac.selected { border-color:var(--accent); background:var(--accent-dim); }
    .fac .fi { font-size:24px; }
    .fac .fn { font-size:12px; font-weight:700; margin:4px 0 2px; }
    .fac .fm { font-size:10px; color:var(--text-muted); }
    .bk-row { display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border); font-size:13px; gap:8px; }
    .bk-row:last-child { border-bottom:none; }
    .bk-fac { font-weight:700; }
    .bk-meta { font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
    .bk-actions { display:flex; gap:6px; }
    .btn-sm-ok { background:var(--green); color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:11px; font-weight:600; cursor:pointer; }
    .btn-sm-no { background:var(--red); color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:11px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <nav class="nav" id="mainNav"></nav>
  <main class="main">
    <div class="page-header animate-in">
      <div class="page-icon gold">📅</div>
      <h1 class="page-title" id="txt-title"></h1>
      <p class="page-subtitle" id="txt-subtitle"></p>
    </div>

    <div class="mode-row animate-in">
      <div class="mode active" id="modeOwner" onclick="switchMode('owner')">🏠 <span id="txt-mode-owner"></span></div>
      <div class="mode" id="modeAdmin" onclick="switchMode('admin')">⚙️ <span id="txt-mode-admin"></span></div>
    </div>

    <div id="ownerLogin">
      <div class="section animate-in">
        <div class="section-title" id="txt-login-title"></div>
        <div class="field"><label id="txt-unit-lbl"></label><input id="unit" onkeydown="if(event.key==='Enter')ownerLogin()"></div>
        <div class="field"><label id="txt-cred-lbl"></label><input id="cred" onkeydown="if(event.key==='Enter')ownerLogin()"></div>
        <div class="error-text" id="err" style="margin-bottom:8px"></div>
        <button class="btn btn-gold" onclick="ownerLogin()" id="txt-login-btn"></button>
      </div>
    </div>

    <div id="adminPinBox" style="display:none">
      <div class="section animate-in">
        <div class="section-title" id="txt-admin-pin-title"></div>
        <div class="field"><input type="password" id="pin" maxlength="10" onkeydown="if(event.key==='Enter')adminLogin()"></div>
        <button class="btn btn-gold" onclick="adminLogin()" id="txt-admin-login-btn"></button>
      </div>
    </div>

    <div id="content" style="display:none">
      <!-- OWNER -->
      <div id="ownerContent">
        <div class="section animate-in">
          <div class="section-title" id="txt-new-section"></div>
          <div class="fac-grid" id="facGrid"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
            <div class="field" style="flex:1;min-width:130px;margin-bottom:0"><label id="txt-bk-date"></label><input type="date" id="bkDate"></div>
            <div class="field" style="flex:0 0 110px;margin-bottom:0"><label id="txt-bk-start"></label><input type="time" id="bkStart" value="10:00"></div>
            <div class="field" style="flex:0 0 110px;margin-bottom:0"><label id="txt-bk-end"></label><input type="time" id="bkEnd" value="12:00"></div>
          </div>
          <button class="btn btn-gold" style="margin-top:12px" onclick="book()" id="txt-bk-book"></button>
        </div>
        <div class="section animate-in">
          <div class="section-title" id="txt-my-section"></div>
          <div id="myBookings"></div>
        </div>
      </div>

      <!-- ADMIN -->
      <div id="adminContent" style="display:none">
        <div class="section animate-in">
          <div class="section-title" id="txt-manage-section"></div>
          <div id="allBookings"></div>
        </div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderNav('bk_title')
    const $ = id => document.getElementById(id)
    let mode = 'owner', curUnit = null, selectedFac = null

    $('txt-title').textContent = t('bk_title'); $('txt-subtitle').textContent = t('bk_subtitle')
    $('txt-mode-owner').textContent = t('role_owner'); $('txt-mode-admin').textContent = t('role_admin')
    $('txt-login-title').textContent = t('owner_section_login')
    $('txt-unit-lbl').textContent = t('owner_unit_label'); $('txt-cred-lbl').textContent = t('owner_credential_label')
    $('txt-login-btn').textContent = t('check')
    $('txt-admin-pin-title').textContent = t('admin_pin_title'); $('txt-admin-login-btn').textContent = t('enter')
    $('txt-new-section').textContent = t('bk_new_section')
    $('txt-bk-date').textContent = t('bk_date'); $('txt-bk-start').textContent = t('bk_start'); $('txt-bk-end').textContent = t('bk_end')
    $('txt-bk-book').textContent = '✓ ' + t('bk_book'); $('txt-my-section').textContent = t('bk_mine')
    $('txt-manage-section').textContent = t('bk_all')

    async function loadFacilities() {
      const facs = await apiGetFacilities()
      $('facGrid').innerHTML = facs.map(f =>
        '<div class="fac" id="fac-' + f.id + '" onclick="selectFac(\'' + f.id + '\')">' +
          '<div class="fi">' + f.icon + '</div><div class="fn">' + esc(f.name) + '</div>' +
          '<div class="fm">' + t('bk_capacity') + ': ' + f.capacity + ' · ' + (f.cost > 0 ? fmtMoney(f.cost) : t('bk_free')) + '</div></div>'
      ).join('')
    }
    function selectFac(id) {
      selectedFac = id
      document.querySelectorAll('.fac').forEach(f => f.classList.remove('selected'))
      $('fac-' + id).classList.add('selected')
    }

    function switchMode(m) {
      mode = m
      $('modeOwner').classList.toggle('active', m === 'owner')
      $('modeAdmin').classList.toggle('active', m === 'admin')
      $('ownerLogin').style.display = m === 'owner' ? 'block' : 'none'
      $('adminPinBox').style.display = m === 'admin' ? 'block' : 'none'
      $('content').style.display = 'none'
    }

    function ownerLogin() {
      const unit = $('unit').value.trim(), cred = $('cred').value.trim()
      if (!unit || !cred) { $('err').textContent = t('owner_error_fill'); return }
      const isEmail = cred.includes('@')
      apiCheckOwner({ unit, email: isEmail ? cred : '', phone: isEmail ? '' : cred }).then(d => {
        if (d.error) { $('err').textContent = d.error; return }
        curUnit = d.owner.unit; $('err').textContent = ''
        $('content').style.display = 'block'
        $('adminContent').style.display = 'none'
        $('ownerContent').style.display = 'block'
        loadFacilities(); loadMyBookings()
      })
    }

    function adminLogin() {
      if ($('pin').value !== kj_load().settings.pin_admin) { showToast(t('admin_pin_error'), 'error-toast'); return }
      curUnit = null
      $('content').style.display = 'block'
      $('ownerContent').style.display = 'none'
      $('adminContent').style.display = 'block'
      loadAllBookings()
    }

    async function book() {
      if (!curUnit) { showToast(t('bk_login_hint'), 'error-toast'); return }
      if (!selectedFac) { showToast(t('bk_facility'), 'error-toast'); return }
      const date = $('bkDate').value, start = $('bkStart').value, end = $('bkEnd').value
      if (!date || !start || !end) { showToast(t('bk_date'), 'error-toast'); return }
      if (end <= start) { showToast(t('bk_slot_busy'), 'error-toast'); return }
      const fac = (await apiGetFacilities()).find(f => f.id === selectedFac)
      if (!apiSlotFree(selectedFac, date, start, end)) { showToast(t('bk_slot_busy'), 'error-toast'); return }
      await apiAddBooking({ unit: curUnit, facility_id: selectedFac, facility_name: fac.name, date, start, end })
      showToast(t('bk_success'), 'success')
      loadMyBookings()
    }

    async function loadMyBookings() {
      const list = (await apiGetBookings()).filter(b => b.unit === curUnit)
      const el = $('myBookings')
      if (!list.length) { el.innerHTML = emptyState('📅', t('bk_empty')); return }
      el.innerHTML = list.map(b =>
        '<div class="bk-row"><div style="flex:1;min-width:0">' +
          '<div class="bk-fac">' + esc(b.facility_name) + '</div>' +
          '<div class="bk-meta">' + esc(b.date) + ' · ' + esc(b.start) + '–' + esc(b.end) + '</div></div>' +
          badgeHtml(b.status) + '</div>'
      ).join('')
    }

    async function loadAllBookings() {
      const list = await apiGetBookings()
      const el = $('allBookings')
      if (!list.length) { el.innerHTML = emptyState('📅', t('bk_empty')); return }
      el.innerHTML = list.map(b =>
        '<div class="bk-row">' +
          '<div style="flex:1;min-width:0"><div class="bk-fac">' + esc(b.facility_name) + '</div>' +
          '<div class="bk-meta">Unit ' + esc(b.unit) + ' · ' + esc(b.date) + ' · ' + esc(b.start) + '–' + esc(b.end) + '</div></div>' +
          badgeHtml(b.status) +
          (b.status === 'Pending' ? '<div class="bk-actions">' +
            '<button class="btn-sm-ok" onclick="decide(\'' + b.id + '\',\'Approved\')">' + t('bk_approve') + '</button>' +
            '<button class="btn-sm-no" onclick="decide(\'' + b.id + '\',\'Rejected\')">' + t('bk_reject') + '</button></div>' : '') +
        '</div>'
      ).join('')
    }

    async function decide(id, status) {
      await apiUpdateBooking(id, status)
      showToast(status === 'Approved' ? t('st_approved') : t('st_rejected'), 'success')
      loadAllBookings()
    }
  </script>
</body>
</html>

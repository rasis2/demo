<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penyelenggaraan — Kesuma JMB</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .mode-row { display:flex; gap:6px; margin-bottom:14px; background:var(--surface2); border-radius:10px; padding:4px; }
    .mode { flex:1; text-align:center; padding:8px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; transition:all 0.2s; color:var(--text-muted); }
    .mode.active { background:var(--surface); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.15); }
    .mnt-card { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
    .mnt-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:4px; }
    .mnt-title { font-family:var(--heading-font); font-weight:700; font-size:14px; }
    .mnt-meta { font-size:11px; color:var(--text-muted); margin:4px 0; font-family:'JetBrains Mono',monospace; }
    .mnt-desc { font-size:12.5px; color:var(--text-soft); margin-bottom:8px; line-height:1.5; }
    .mnt-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .mnt-actions select { width:auto; padding:6px 10px; font-size:12px; }
    .mnt-notes-box { margin-top:8px; display:flex; gap:6px; }
    .mnt-notes-box input { flex:1; font-size:12px; padding:7px 10px; }
  </style>
</head>
<body>
  <nav class="nav" id="mainNav"></nav>
  <main class="main">
    <div class="page-header animate-in">
      <div class="page-icon gold">🔧</div>
      <h1 class="page-title" id="txt-title"></h1>
      <p class="page-subtitle" id="txt-subtitle"></p>
    </div>

    <!-- Mode: Owner / Admin -->
    <div class="mode-row animate-in">
      <div class="mode active" id="modeOwner" onclick="switchMode('owner')">🏠 <span id="txt-mode-owner"></span></div>
      <div class="mode" id="modeAdmin" onclick="switchMode('admin')">⚙️ <span id="txt-mode-admin"></span></div>
    </div>

    <!-- OWNER LOGIN -->
    <div id="ownerLogin">
      <div class="section animate-in">
        <div class="section-title" id="txt-login-title"></div>
        <div class="field"><label id="txt-unit-lbl"></label><input id="unit" onkeydown="if(event.key==='Enter')ownerLogin()"></div>
        <div class="field"><label id="txt-cred-lbl"></label><input id="cred" onkeydown="if(event.key==='Enter')ownerLogin()"></div>
        <div class="error-text" id="err" style="margin-bottom:8px"></div>
        <button class="btn btn-gold" onclick="ownerLogin()" id="txt-login-btn"></button>
      </div>
    </div>

    <!-- ADMIN PIN -->
    <div id="adminPinBox" style="display:none">
      <div class="section animate-in">
        <div class="section-title" id="txt-admin-pin-title"></div>
        <div class="field"><input type="password" id="pin" maxlength="10" onkeydown="if(event.key==='Enter')adminLogin()"></div>
        <button class="btn btn-gold" onclick="adminLogin()" id="txt-admin-login-btn"></button>
      </div>
    </div>

    <!-- CONTENT -->
    <div id="content" style="display:none">
      <!-- Report form -->
      <div class="section animate-in">
        <div class="section-title" id="txt-report-section"></div>
        <div class="field"><label id="txt-mnt-unit"></label><input id="mntUnit" readonly></div>
        <div class="field">
          <label id="txt-mnt-cat"></label>
          <div class="select-wrap"><select id="mntCat"></select></div>
        </div>
        <div class="field"><label id="txt-mnt-title"></label><input id="mntTitle" placeholder="" maxlength="80"></div>
        <div class="field"><label id="txt-mnt-desc"></label><textarea id="mntDesc" rows="3" placeholder=""></textarea></div>
        <div class="field">
          <label id="txt-mnt-prio"></label>
          <div class="select-wrap"><select id="mntPrio"></select></div>
        </div>
        <button class="btn btn-gold" onclick="submitReport()" id="txt-mnt-submit"></button>
      </div>

      <!-- List -->
      <div class="section animate-in">
        <div class="section-title" id="txt-list-section"></div>
        <div id="list"></div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderNav('mnt_title')
    const $ = id => document.getElementById(id)
    let mode = 'owner', curUnit = null

    $('txt-title').textContent = t('mnt_title'); $('txt-subtitle').textContent = t('mnt_subtitle')
    $('txt-mode-owner').textContent = t('role_owner'); $('txt-mode-admin').textContent = t('role_admin')
    $('txt-login-title').textContent = t('owner_section_login')
    $('txt-unit-lbl').textContent = t('owner_unit_label'); $('txt-cred-lbl').textContent = t('owner_credential_label')
    $('txt-login-btn').textContent = t('check')
    $('txt-admin-pin-title').textContent = t('admin_pin_title'); $('txt-admin-login-btn').textContent = t('enter')
    $('txt-report-section').textContent = t('mnt_report_section')
    $('txt-mnt-unit').textContent = t('mnt_unit_lbl'); $('txt-mnt-cat').textContent = t('mnt_category')
    $('txt-mnt-title').textContent = t('mnt_title_lbl'); $('txt-mnt-desc').textContent = t('mnt_desc_lbl')
    $('txt-mnt-prio').textContent = t('mnt_priority'); $('txt-mnt-submit').textContent = t('mnt_submit')
    $('txt-list-section').textContent = t('mnt_list_section')
    $('mntTitle').placeholder = t('mnt_ph_title'); $('mntDesc').placeholder = t('mnt_ph_desc')

    MAINT_CATEGORIES.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = t('mnt_cat_' + c.toLowerCase().replace(' / ', '_')) ; $('mntCat').appendChild(o) })
    const catMap = { 'Elektrik':'mnt_cat_elektrik','Paip':'mnt_cat_paip','Lif':'mnt_cat_lif','Kebocoran':'mnt_cat_bocor','Kebersihan':'mnt_cat_besih','Keselamatan':'mnt_cat_keselamatan','Lain-lain':'mnt_cat_lain' }
    $('mntCat').innerHTML = ''
    Object.keys(catMap).forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = t(catMap[c]); $('mntCat').appendChild(o) })
    MAINT_PRIORITIES.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = t('mnt_prio_' + p.toLowerCase()); $('mntPrio').appendChild(o) })

    function switchMode(m) {
      mode = m
      $('modeOwner').classList.toggle('active', m === 'owner')
      $('modeAdmin').classList.toggle('active', m === 'admin')
      $('ownerLogin').style.display = m === 'owner' ? 'block' : 'none'
      $('adminPinBox').style.display = m === 'admin' ? 'block' : 'none'
      $('content').style.display = 'none'
    }

    function ownerLogin() {
      const unit = $('unit').value.trim(), cred = $('cred').value.trim()
      if (!unit || !cred) { $('err').textContent = t('owner_error_fill'); return }
      const isEmail = cred.includes('@')
      apiCheckOwner({ unit, email: isEmail ? cred : '', phone: isEmail ? '' : cred }).then(d => {
        if (d.error) { $('err').textContent = d.error; return }
        curUnit = d.owner.unit
        $('err').textContent = ''
        $('content').style.display = 'block'
        $('mntUnit').value = curUnit
        loadList()
      })
    }

    function adminLogin() {
      if ($('pin').value !== kj_load().settings.pin_admin) { showToast(t('admin_pin_error'), 'error-toast'); return }
      curUnit = null
      $('content').style.display = 'block'
      $('mntUnit').value = ''
      $('mntUnit').placeholder = '—'
      loadList()
    }

    async function submitReport() {
      if (!curUnit && mode !== 'admin') { showToast(t('mnt_login_hint'), 'error-toast'); return }
      const title = $('mntTitle').value.trim(), desc = $('mntDesc').value.trim()
      if (!title) { showToast(t('mnt_ph_title'), 'error-toast'); return }
      await apiAddMaintenance({ unit: curUnit || 'Admin', category: $('mntCat').value, title, desc, priority: $('mntPrio').value })
      showToast(t('mnt_success'), 'success')
      $('mntTitle').value = ''; $('mntDesc').value = ''
      loadList()
    }

    async function loadList() {
      const all = await apiGetMaintenance()
      const list = mode === 'admin' ? all : all.filter(m => m.unit === curUnit)
      const el = $('list')
      if (!list.length) { el.innerHTML = emptyState('🔧', t('mnt_empty')); return }
      el.innerHTML = list.map(m => `
        <div class="mnt-card animate-in">
          <div class="mnt-top">
            <div class="mnt-title">${esc(m.title)}</div>
            ${badgeHtml(m.status)}
          </div>
          <div class="mnt-meta">${esc(m.unit)} · ${t(catMap[m.category] || 'mnt_cat_lain')} · <b>${t('mnt_priority')}: ${t('mnt_prio_' + (m.priority||'low').toLowerCase())}</b> · ${fmtDate(m.created_at)}</div>
          <div class="mnt-desc">${esc(m.desc)}</div>
          ${mode === 'admin' ? `
            <div class="mnt-actions">
              <div class="select-wrap"><select onchange="setStatus('${m.id}', this.value)">
                ${['Open','In Progress','Resolved'].map(s => `<option value="${s}" ${m.status===s?'selected':''}>${t(s==='Open'?'st_open':s==='In Progress'?'st_progress':'st_resolved')}</option>`).join('')}
              </select></div>
              <div class="mnt-notes-box">
                <input id="note-${m.id}" value="${esc(m.notes)}" placeholder="${t('mnt_notes')}">
                <button class="btn btn-outline" onclick="saveNote('${m.id}')">${t('mnt_save_notes')}</button>
              </div>
            </div>` : ''}
        </div>`).join('')
    }

    async function setStatus(id, status) {
      await apiUpdateMaintenance(id, { status })
      showToast(t('mnt_update'), 'success'); loadList()
    }
    async function saveNote(id) {
      const notes = $('note-' + id).value
      await apiUpdateMaintenance(id, { notes })
      showToast(t('mnt_save_notes'), 'success')
    }
  </script>
</body>
</html>

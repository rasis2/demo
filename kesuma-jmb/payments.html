<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran — Kesuma JMB</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .mode-row { display:flex; gap:6px; margin-bottom:14px; background:var(--surface2); border-radius:10px; padding:4px; }
    .mode { flex:1; text-align:center; padding:8px; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; transition:all 0.2s; color:var(--text-muted); }
    .mode.active { background:var(--surface); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.15); }
    .bal-grid { display:flex; gap:0; padding:0; overflow:hidden; margin-bottom:14px; }
    .bal-grid > div { flex:1; padding:16px; text-align:center; border-right:1px solid var(--border); }
    .bal-grid > div:last-child { border-right:none; }
    .bal-val { font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:600; }
    .bal-lbl { font-size:10px; color:var(--text-muted); margin-top:3px; }
    .pay-row { display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border); font-size:13px; gap:8px; }
    .pay-row:last-child { border-bottom:none; }
    .pay-amt { font-family:'JetBrains Mono',monospace; font-weight:600; }
    .pay-meta { font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
  </style>
</head>
<body>
  <nav class="nav" id="mainNav"></nav>
  <main class="main">
    <div class="page-header animate-in">
      <div class="page-icon gold">💰</div>
      <h1 class="page-title" id="txt-title"></h1>
      <p class="page-subtitle" id="txt-subtitle"></p>
    </div>

    <div class="mode-row animate-in">
      <div class="mode active" id="modeOwner" onclick="switchMode('owner')">🏠 <span id="txt-mode-owner"></span></div>
      <div class="mode" id="modeAdmin" onclick="switchMode('admin')">⚙️ <span id="txt-mode-admin"></span></div>
    </div>

    <div id="ownerLogin">
      <div class="section animate-in">
        <div class="section-title" id="txt-login-title"></div>
        <div class="field"><label id="txt-unit-lbl"></label><input id="unit" onkeydown="if(event.key==='Enter')ownerLogin()"></div>
        <div class="field"><label id="txt-cred-lbl"></label><input id="cred" onkeydown="if(event.key==='Enter')ownerLogin()"></div>
        <div class="error-text" id="err" style="margin-bottom:8px"></div>
        <button class="btn btn-gold" onclick="ownerLogin()" id="txt-login-btn"></button>
      </div>
    </div>

    <div id="adminPinBox" style="display:none">
      <div class="section animate-in">
        <div class="section-title" id="txt-admin-pin-title"></div>
        <div class="field"><input type="password" id="pin" maxlength="10" onkeydown="if(event.key==='Enter')adminLogin()"></div>
        <button class="btn btn-gold" onclick="adminLogin()" id="txt-admin-login-btn"></button>
      </div>
    </div>

    <div id="content" style="display:none">
      <!-- OWNER: balance + pay -->
      <div id="ownerContent">
        <div class="section animate-in bal-grid" id="balGrid"></div>

        <div class="section animate-in">
          <div class="section-title" id="txt-pay-section"></div>
          <div class="field"><label id="txt-pay-period"></label><input id="payPeriod" placeholder="" maxlength="40"></div>
          <div class="field">
            <label id="txt-pay-method"></label>
            <div class="select-wrap"><select id="payMethod"></select></div>
          </div>
          <div class="field"><label id="txt-pay-amount"></label><input id="payAmount" type="number" readonly style="font-family:'JetBrains Mono',monospace"></div>
          <button class="btn btn-gold" onclick="makePayment()" id="txt-pay-make"></button>
        </div>

        <div class="section animate-in">
          <div class="section-title" id="txt-pay-history"></div>
          <div id="payHistory"></div>
        </div>
      </div>

      <!-- ADMIN: fee config + all payments -->
      <div id="adminContent" style="display:none">
        <div class="section animate-in">
          <div class="section-title" id="txt-fee-section"></div>
          <div style="display:flex;gap:8px;align-items:flex-end">
            <div class="field" style="flex:1;margin-bottom:0"><label id="txt-fee-lbl"></label><input id="feeInput" type="number"></div>
            <button class="btn btn-green" onclick="saveFee()" id="txt-fee-save"></button>
          </div>
        </div>
        <div class="section animate-in">
          <div class="section-title" id="txt-pay-record"></div>
          <div class="field"><label id="txt-unit-lbl2"></label><input id="admUnit" placeholder="4-1"></div>
          <div class="field"><label id="txt-pay-period"></label><input id="admPeriod" placeholder="" maxlength="40"></div>
          <div style="display:flex;gap:8px">
            <div class="field" style="flex:1"><label id="txt-pay-method"></label><div class="select-wrap"><select id="admMethod"></select></div></div>
            <div class="field" style="flex:0 0 130px"><label id="txt-pay-amount"></label><input id="admAmount" type="number"></div>
          </div>
          <button class="btn btn-gold" onclick="recordPayment()" id="txt-pay-record-btn"></button>
        </div>
        <div class="section animate-in">
          <div class="section-title" id="txt-pay-all"></div>
          <div id="allPayments"></div>
        </div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderNav('pay_title')
    const $ = id => document.getElementById(id)
    let mode = 'owner', curUnit = null, curPayments = []

    $('txt-title').textContent = t('pay_title'); $('txt-subtitle').textContent = t('pay_subtitle')
    $('txt-mode-owner').textContent = t('role_owner'); $('txt-mode-admin').textContent = t('role_admin')
    $('txt-login-title').textContent = t('owner_section_login')
    $('txt-unit-lbl').textContent = t('owner_unit_label'); $('txt-cred-lbl').textContent = t('owner_credential_label')
    $('txt-login-btn').textContent = t('check')
    $('txt-admin-pin-title').textContent = t('admin_pin_title'); $('txt-admin-login-btn').textContent = t('enter')
    $('txt-pay-section').textContent = t('pay_make')
    $('txt-pay-period').textContent = t('pay_period'); $('payPeriod').placeholder = t('pay_ph_period')
    $('txt-pay-method').textContent = t('pay_method'); $('txt-pay-amount').textContent = t('pay_amount')
    $('txt-pay-make').textContent = '✓ ' + t('pay_make'); $('txt-pay-history').textContent = t('pay_history')
    $('txt-fee-section').textContent = t('pay_manage_fee'); $('txt-fee-lbl').textContent = t('pay_fee_lbl'); $('txt-fee-save').textContent = t('pay_save')
    $('txt-pay-record').textContent = t('pay_record'); $('txt-unit-lbl2').textContent = t('unit')
    $('txt-pay-record-btn').textContent = '✓ ' + t('pay_make'); $('txt-pay-all').textContent = t('pay_history')

    const fillMethods = sel => {
      $(sel).innerHTML = ''
      const mKey = { 'FPX':'pay_mtd_fpx', 'DuitNow':'pay_mtd_duitnow', 'Cash':'pay_mtd_cash', 'Bank Transfer':'pay_mtd_bank', 'JomPAY':'pay_mtd_jompay' }
      PAY_METHODS.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = t(mKey[m] || m); $(sel).appendChild(o) })
    }
    fillMethods('payMethod'); fillMethods('admMethod')

    function switchMode(m) {
      mode = m
      $('modeOwner').classList.toggle('active', m === 'owner')
      $('modeAdmin').classList.toggle('active', m === 'admin')
      $('ownerLogin').style.display = m === 'owner' ? 'block' : 'none'
      $('adminPinBox').style.display = m === 'admin' ? 'block' : 'none'
      $('content').style.display = 'none'
    }

    function ownerLogin() {
      const unit = $('unit').value.trim(), cred = $('cred').value.trim()
      if (!unit || !cred) { $('err').textContent = t('owner_error_fill'); return }
      const isEmail = cred.includes('@')
      apiCheckOwner({ unit, email: isEmail ? cred : '', phone: isEmail ? '' : cred }).then(async d => {
        if (d.error) { $('err').textContent = d.error; return }
        curUnit = d.owner.unit
        $('err').textContent = ''
        $('content').style.display = 'block'
        $('adminContent').style.display = 'none'
        $('ownerContent').style.display = 'block'
        const fees = await apiGetFees()
        $('payAmount').value = fees.monthly
        loadOwner()
      })
    }

    function adminLogin() {
      if ($('pin').value !== kj_load().settings.pin_admin) { showToast(t('admin_pin_error'), 'error-toast'); return }
      curUnit = null
      $('content').style.display = 'block'
      $('ownerContent').style.display = 'none'
      $('adminContent').style.display = 'block'
      apiGetFees().then(f => { $('feeInput').value = f.monthly })
      loadAllPayments()
    }

    async function loadOwner() {
      curPayments = await apiGetOwnerPayments(curUnit)
      const bal = apiOwnerBalance(curUnit, curPayments)
      $('balGrid').innerHTML =
        '<div><div class="bal-val">' + fmtMoney(bal.fee) + '</div><div class="bal-lbl">' + t('pay_monthly') + '</div></div>' +
        '<div><div class="bal-val" style="color:var(--green)">' + fmtMoney(bal.paid) + '</div><div class="bal-lbl">' + t('pay_paid') + '</div></div>' +
        '<div><div class="bal-val" style="color:' + (bal.outstanding > 0 ? 'var(--red)' : 'var(--text-muted)') + '">' + fmtMoney(bal.outstanding) + '</div><div class="bal-lbl">' + t('pay_outstanding') + '</div></div>'
      renderHistory($('payHistory'), curPayments, true)
    }

    async function makePayment() {
      const period = $('payPeriod').value.trim()
      if (!curUnit || !period) { showToast(t('pay_ph_period'), 'error-toast'); return }
      const fees = await apiGetFees()
      await apiAddPayment({ unit: curUnit, period, amount: fees.monthly, method: $('payMethod').value })
      showToast(t('pay_success'), 'success')
      $('payPeriod').value = ''
      loadOwner()
    }

    async function saveFee() {
      const v = parseFloat($('feeInput').value)
      if (!v || v <= 0) { showToast(t('pay_fee_lbl'), 'error-toast'); return }
      await apiSetFees(v)
      showToast(t('pay_saved'), 'success')
    }

    async function recordPayment() {
      const unit = $('admUnit').value.trim(), period = $('admPeriod').value.trim()
      const amt = parseFloat($('admAmount').value)
      if (!unit || !period || !amt) { showToast(t('no_data'), 'error-toast'); return }
      await apiAddPayment({ unit, period, amount: amt, method: $('admMethod').value })
      showToast(t('pay_success'), 'success')
      $('admUnit').value = ''; $('admPeriod').value = ''; $('admAmount').value = ''
      loadAllPayments()
    }

    async function loadAllPayments() {
      const all = await apiGetPayments()
      renderHistory($('allPayments'), all, false)
    }

    function renderHistory(el, list, showUnit) {
      if (!list.length) { el.innerHTML = emptyState('🧾', t('pay_empty')); return }
      el.innerHTML = list.map(p =>
        '<div class="pay-row"><div style="flex:1;min-width:0">' +
          (showUnit ? '' : '<div style="font-weight:600">' + esc(p.unit) + '</div>') +
          '<div class="pay-meta">' + (p.receipt ? '#' + esc(p.receipt) + ' · ' : '') + esc(p.period) + ' · ' + esc(p.method) + '</div>' +
        '</div>' +
        '<div style="text-align:right"><div class="pay-amt" style="color:var(--green)">' + fmtMoney(p.amount) + '</div>' +
        '<div class="pay-meta">' + fmtDateShort(p.date) + '</div></div></div>'
      ).join('')
    }
  </script>
</body>
</html>

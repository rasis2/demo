<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumen — Kesuma JMB</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .doc-card { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:flex-start; gap:12px; }
    .doc-icon { font-size:26px; flex-shrink:0; }
    .doc-title { font-family:var(--heading-font); font-weight:700; font-size:14px; }
    .doc-meta { font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; margin:2px 0 4px; }
    .doc-desc { font-size:12.5px; color:var(--text-soft); line-height:1.5; }
    .btn-sm-danger { background:var(--red-dim); color:var(--red); border:1px solid rgba(224,92,92,0.3); border-radius:7px; padding:6px 12px; font-size:11px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <nav class="nav" id="mainNav"></nav>
  <main class="main">
    <div class="page-header animate-in">
      <div class="page-icon gold">📄</div>
      <h1 class="page-title" id="txt-title"></h1>
      <p class="page-subtitle" id="txt-subtitle"></p>
    </div>

    <div class="mode-row" style="display:flex;gap:6px;margin-bottom:14px;background:var(--surface2);border-radius:10px;padding:4px">
      <div class="mode" style="flex:1;text-align:center;padding:8px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-muted)" id="modeView" onclick="switchMode('view')">👁️ <span id="txt-mode-view"></span></div>
      <div class="mode" style="flex:1;text-align:center;padding:8px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-muted)" id="modeAdmin" onclick="switchMode('admin')">⚙️ <span id="txt-mode-admin"></span></div>
    </div>

    <div id="adminPinBox" style="display:none">
      <div class="section animate-in">
        <div class="section-title" id="txt-admin-pin-title"></div>
        <div class="field"><input type="password" id="pin" maxlength="10" onkeydown="if(event.key==='Enter')adminLogin()"></div>
        <button class="btn btn-gold" onclick="adminLogin()" id="txt-admin-login-btn"></button>
      </div>
    </div>

    <div id="addForm" style="display:none">
      <div class="section animate-in">
        <div class="section-title" id="txt-add-section"></div>
        <div class="field"><label id="txt-doc-title"></label><input id="docTitle" maxlength="100"></div>
        <div class="field">
          <label id="txt-doc-cat"></label>
          <div class="select-wrap"><select id="docCat"></select></div>
        </div>
        <div class="field"><label id="txt-doc-desc"></label><textarea id="docDesc" rows="2"></textarea></div>
        <div class="field"><label id="txt-doc-url"></label><input id="docUrl" placeholder="https://…"></div>
        <button class="btn btn-gold" onclick="addDoc()" id="txt-doc-add"></button>
      </div>
    </div>

    <div class="section animate-in">
      <div class="section-title" id="txt-list-section"></div>
      <div id="docList"></div>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderNav('doc_title')
    const $ = id => document.getElementById(id)
    let admin = false

    $('txt-title').textContent = t('doc_title'); $('txt-subtitle').textContent = t('doc_subtitle')
    $('txt-mode-view').textContent = t('view'); $('txt-mode-admin').textContent = t('role_admin')
    $('txt-admin-pin-title').textContent = t('admin_pin_title'); $('txt-admin-login-btn').textContent = t('enter')
    $('txt-add-section').textContent = t('doc_add_section')
    $('txt-doc-title').textContent = t('doc_title_lbl'); $('txt-doc-cat').textContent = t('doc_cat')
    $('txt-doc-desc').textContent = t('doc_desc_lbl'); $('txt-doc-url').textContent = t('doc_url_lbl')
    $('txt-doc-add').textContent = '✓ ' + t('doc_add'); $('txt-list-section').textContent = t('doc_list_section')

    const catKeys = { 'AGM':'doc_cat_agm', 'Kewangan':'doc_cat_kewangan', 'Borang':'doc_cat_borang', 'Polisi':'doc_cat_polisi', 'Laporan':'doc_cat_laporan' }
    Object.keys(catKeys).forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = t(catKeys[c]); $('docCat').appendChild(o) })

    function switchMode(m) {
      $('modeView').style.background = m === 'view' ? 'var(--surface)' : 'transparent'
      $('modeView').style.color = m === 'view' ? 'var(--text)' : 'var(--text-muted)'
      $('modeAdmin').style.background = m === 'admin' ? 'var(--surface)' : 'transparent'
      $('modeAdmin').style.color = m === 'admin' ? 'var(--text)' : 'var(--text-muted)'
      $('adminPinBox').style.display = m === 'admin' && !admin ? 'block' : 'none'
      $('addForm').style.display = admin ? 'block' : 'none'
    }
    function adminLogin() {
      if ($('pin').value !== kj_load().settings.pin_admin) { showToast(t('admin_pin_error'), 'error-toast'); return }
      admin = true; $('adminPinBox').style.display = 'none'; $('addForm').style.display = 'block'
    }
    async function addDoc() {
      const title = $('docTitle').value.trim()
      if (!title) { showToast(t('doc_title_lbl'), 'error-toast'); return }
      await apiAddDocument({ title, category: $('docCat').value, desc: $('docDesc').value.trim(), url: $('docUrl').value.trim() })
      showToast(t('doc_success'), 'success')
      $('docTitle').value = ''; $('docDesc').value = ''; $('docUrl').value = ''
      loadList()
    }
    async function remove(id) {
      await apiDeleteDocument(id)
      showToast(t('doc_delete'), 'success')
      loadList()
    }
    async function loadList() {
      const list = await apiGetDocuments()
      const el = $('docList')
      if (!list.length) { el.innerHTML = emptyState('📄', t('doc_empty')); return }
      el.innerHTML = list.map(d =>
        '<div class="doc-card"><div class="doc-icon">📄</div>' +
          '<div style="flex:1;min-width:0"><div class="doc-title">' + esc(d.title) + '</div>' +
          '<div class="doc-meta">' + t(catKeys[d.category] || 'doc_cat_borang') + ' · ' + fmtDateShort(d.created_at) + '</div>' +
          (d.desc ? '<div class="doc-desc">' + esc(d.desc) + '</div>' : '') +
          (d.url ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener" class="btn btn-outline" style="margin-top:8px;width:auto;font-size:11px;padding:6px 12px">' + t('doc_view') + ' ↗</a>' : '') +
          '</div>' + (admin ? '<button class="btn-sm-danger" onclick="remove(\'' + d.id + '\')">' + t('doc_delete') + '</button>' : '') +
        '</div>'
      ).join('')
    }
    loadList()
  </script>
</body>
</html>

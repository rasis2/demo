<!DOCTYPE html>
<html lang="ms" data-theme="obsidian">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RK1 — Sistem Pengurusan Harta</title>
  <meta name="description" content="Sistem pengurusan harta bersepadu: parsel, pelawat, penyelenggaraan, pembayaran, notis, tempahan, kenderaan & dokumen.">
  <meta name="theme-color" content="#0e0e10">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="appShell">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">🏢</div>
        <div class="sidebar-brand">
          <div class="b1">RK1</div>
          <div class="b2" data-i18n="app_tagline">Sistem Pengurusan Harta</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer" id="sidebarFooter"></div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-spacer"></div>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeBtn" title="Theme">🌙</button>
          <button class="icon-btn" id="langBtn" title="Language">🇲🇾</button>
        </div>
      </header>
      <div class="content" id="appContent"></div>
    </main>
  </div>

  <!-- SETUP OVERLAY (shown when Supabase not configured) -->
  <div class="modal-overlay" id="setupOverlay">
    <div class="modal" style="max-width:520px">
      <div class="modal-head">
        <h3 data-i18n="setup_title">Sambungkan Supabase</h3>
      </div>
      <div class="modal-body">
        <div class="empty" style="padding:8px 0 14px">
          <div class="ei">🔌</div>
          <h3 style="font-family:var(--font-display);font-weight:800;color:var(--text);font-size:18px;margin-bottom:6px" data-i18n="setup_welcome">Selamat datang ke Kesuma JMB</h3>
          <p style="font-size:12.5px;line-height:1.6;max-width:400px;margin:0 auto" data-i18n="setup_desc"></p>
        </div>
        <div class="field">
          <label data-i18n="setup_url">Supabase URL</label>
          <input class="input" id="setupUrl" placeholder="https://xxxx.supabase.co" spellcheck="false">
        </div>
        <div class="field">
          <label data-i18n="setup_key">Anon Public Key</label>
          <textarea class="textarea" id="setupKey" rows="3" placeholder="eyJhbGciOi…" style="font-family:var(--font-mono);font-size:12px"></textarea>
        </div>
        <div class="error-text" id="setupError" style="margin-bottom:8px"></div>
        <button class="btn btn-primary btn-block btn-lg" id="setupBtn" data-i18n="setup_save">Sambungkan</button>
        <p style="text-align:center;font-size:11.5px;color:var(--text-muted);margin-top:14px">
          <span data-i18n="setup_help">Perlu skema?</span>
          <a href="schema.sql" target="_blank" style="color:var(--accent);font-weight:600">schema.sql ↗</a>
        </p>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="vendor/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views-1.js"></script>
  <script src="js/views-2.js"></script>
  <script src="js/views-3.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parameswara: Pelayaran Bersejarah</title>
<meta name="description" content="Game interaktif sejarah Melayu — bawa Parameswara selamat merentasi lautan dari Palembang ke Temasik. Dibina dengan Phaser 3.">
<link rel="icon" href="jong.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&family=Yeon+Sung&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #06090f;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    height: 100%;
  }
  #game-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    max-width: 100vw; max-height: 100vh;
  }
  #err {
    display: none;
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    background: #1a1010; color: #f88;
    border: 1px solid #f88; border-radius: 8px;
    padding: 18px 22px; max-width: 80vw;
    font: 13px/1.5 'Consolas', monospace;
    z-index: 999;
  }
</style>
</head>
<body>
<div id="game-wrap"></div>
<div id="err"></div>
<script src="phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>

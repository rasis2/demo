<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCode Usage · Kuota</title>
    <meta name="description" content="Penggunaan OpenCode sebenar — kuota mingguan/bulanan, ranking kos mengikut ejen, model LLM dan gunaan alat.">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <a href="../index.html" class="back" aria-label="Portal Demo">←</a>
        <div class="brand">
            <h1>OpenCode <span>Usage</span></h1>
            <span class="stamp" id="stamp"></span>
        </div>
        <div class="lang">
            <button class="lb active" data-lang="ms" onclick="setLang('ms')">BM</button>
            <button class="lb" data-lang="en" onclick="setLang('en')">EN</button>
        </div>
    </header>

    <main>
        <section class="stats" id="stats"></section>

        <!-- Kuota: mingguan + bulanan -->
        <section class="quota-grid">
            <div class="card meter-card" id="meterWeeklyCard">
                <div class="meter-head">
                    <h2 data-i="meter_weekly_title">Kuota Mingguan</h2>
                    <span class="meter-badge" id="meterWeeklyBadge"></span>
                </div>
                <p class="chart-sub" id="meterWeeklySub"></p>
                <div class="meter-bar">
                    <div class="meter-fill" id="meterWeeklyFill" style="width:0%"></div>
                </div>
                <p class="meter-reset" id="meterWeeklyReset"></p>
            </div>

            <div class="card meter-card" id="meterMonthlyCard">
                <div class="meter-head">
                    <h2 data-i="meter_monthly_title">Kuota Bulanan</h2>
                    <span class="meter-badge" id="meterMonthlyBadge"></span>
                </div>
                <p class="chart-sub" id="meterMonthlySub"></p>
                <div class="meter-bar">
                    <div class="meter-fill" id="meterMonthlyFill" style="width:0%"></div>
                </div>
                <p class="meter-reset" id="meterMonthlyReset"></p>
            </div>
        </section>

        <!-- Ranking kos mengikut ejen -->
        <section class="card">
            <div class="meter-head">
                <h2 data-i="title_consumers">Ranking Kos Mengikut Ejen</h2>
                <span class="total-chip" id="totalChip"></span>
            </div>
            <p class="chart-sub" id="consumersSub"></p>
            <div class="bars" id="bars-consumers"></div>
        </section>

        <!-- Model + Alat -->
        <section class="cards">
            <div class="card">
                <h2 data-i="title_models">Pengagihan Model LLM</h2>
                <div class="bars" id="bars-models"></div>
            </div>
            <div class="card">
                <h2 data-i="title_tools">Gunaan Alat</h2>
                <div class="bars" id="bars-tools"></div>
            </div>
        </section>

        <p class="note" id="note"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>

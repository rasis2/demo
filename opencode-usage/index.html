<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCode Usage</title>
    <meta name="description" content="Penggunaan OpenCode sebenar daripada opencode.log — model LLM dan gunaan alat.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <a href="../index.html" class="back" aria-label="Portal Demo">←</a>
        <h1>OpenCode <span>Usage</span></h1>
        <span class="stamp" id="stamp"></span>
    </header>

    <main>
        <section class="stats" id="stats"></section>

        <section class="cards">
            <div class="card">
                <h2>Pengagihan Model LLM</h2>
                <div class="bars" id="bars-models"></div>
            </div>
            <div class="card">
                <h2>Gunaan Alat</h2>
                <div class="bars" id="bars-tools"></div>
            </div>
        </section>

        <p class="note" id="note"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
